{% extends 'base.html' %}

{% block title %}Verificar Acceso{% endblock %}

{% block content %}
<div class="card">
    <h2>Verificación de Acceso</h2>
    
    <form id="accesoForm" style="max-width: 500px; margin: 0 auto;">
        {% csrf_token %}
        <div class="form-group">
            <label for="codigo_credencial" class="required">Código de Credencial</label>
            <input type="text" id="codigo_credencial" name="codigo_credencial" class="form-control" 
                   placeholder="Ingrese o escanee el código" style="font-size: 24px; text-align: center; letter-spacing: 2px;" autofocus>
        </div>
        
        <div class="form-group">
            <label for="tipo" class="required">Tipo de Acceso</label>
            <select id="tipo" name="tipo" class="form-control">
                <option value="Entrada">Entrada</option>
                <option value="Salida">Salida</option>
            </select>
        </div>
        
        <div class="form-group">
            <label for="punto_acceso">Punto de Acceso</label>
            <input type="text" id="punto_acceso" name="punto_acceso" class="form-control" value="Principal">
        </div>
        
        <button type="submit" class="btn btn-primary" style="width: 100%; font-size: 18px; padding: 15px;">
            Verificar Acceso
        </button>
    </form>
    
    <div id="resultado" style="margin-top: 30px; text-align: center; font-size: 20px; font-weight: 500;"></div>
</div>

<script>
document.getElementById('accesoForm').addEventListener('submit', function(e) {
    e.preventDefault();
    
    const formData = new FormData(this);
    const resultadoDiv = document.getElementById('resultado');
    resultadoDiv.innerHTML = '<p style="color: #2196F3;">Verificando...</p>';
    
    fetch('{% url "verificar_acceso" %}', {
        method: 'POST',
        body: formData,
        headers: {
            'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value
        }
    })
    .then(response => response.json())
    .then(data => {
        if (data.exito) {
            resultadoDiv.innerHTML = `<p style="color: #4CAF50; font-size: 24px;">✓ ${data.mensaje}</p>`;
        } else {
            resultadoDiv.innerHTML = `<p style="color: #f44336; font-size: 24px;">✗ ${data.mensaje}</p>`;
        }
        
        // Limpiar campo después de 2 segundos
        setTimeout(() => {
            document.getElementById('codigo_credencial').value = '';
            document.getElementById('codigo_credencial').focus();
        }, 2000);
    })
    .catch(error => {
        resultadoDiv.innerHTML = `<p style="color: #f44336;">Error: ${error.message}</p>`;
    });
});

// Auto-enfoque en el campo de código
document.getElementById('codigo_credencial').focus();
</script>
{% endblock %}
